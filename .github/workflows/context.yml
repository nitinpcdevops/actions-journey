name:context-check
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Show the context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch name: ${{ github.ref_name }}"
          echo "commit id: ${{ github.sha }}"
          echo "event name: ${{ github.event_name }}"
          echo "OS: ${{ runner.os }}"

